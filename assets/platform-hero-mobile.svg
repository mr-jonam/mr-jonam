<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1030" viewBox="0 0 760 1030" role="img" aria-labelledby="title desc"><title id="title">Manoj Rollo — Testing connected platforms</title><desc id="desc">Digital platform quality engineering. SAP, Salesforce, ServiceNow and Dynamics 365 connected by test evidence. QA assessment, automation, performance and AI testing.</desc><defs>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#70f5e0"/><stop offset=".52" stop-color="#6ab9ff"/><stop offset="1" stop-color="#b39aff"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#254b69" stop-opacity=".65"/><stop offset="1" stop-color="#080e1b" stop-opacity="0"/></radialGradient>
<linearGradient id="pane" x2="1" y2="1"><stop stop-color="#172a44"/><stop offset="1" stop-color="#0c1425"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#243751" stroke-opacity=".32"/></pattern></defs><style>
.flow{stroke-dasharray:8 13;animation:flow 9s linear infinite}
.flow-reverse{stroke-dasharray:5 16;animation:flow 13s linear infinite reverse}
.beacon{animation:beacon 7s ease-in-out infinite}
.sweep{animation:sweep 12s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-168}}
@keyframes beacon{0%,100%{opacity:.4}50%{opacity:.9}}
@keyframes sweep{0%,100%{transform:translateY(-115px);opacity:.1}50%{transform:translateY(115px);opacity:.5}}
@media(prefers-reduced-motion:reduce){.flow,.flow-reverse,.beacon,.sweep{animation:none!important}}
</style><rect x="1" y="1" width="758" height="1028" rx="24" fill="#080e1b" stroke="#293c59"/><path d="M26 2H734" stroke="url(#accent)" stroke-width="3"/>
<text x="38" y="59" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#70f5e0" letter-spacing="1.5">MANOJ ROLLO / mr-jonam</text><text x="38" y="113" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#a8b9d2" letter-spacing="2.2">DIGITAL PLATFORM TESTING</text>
<text x="34" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="65" font-weight="700" fill="#f1f6ff" letter-spacing="-2.8">Test the journey.</text><text x="34" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" fill="#70f5e0" letter-spacing="-2.8">Connect the evidence.</text>
<text x="38" y="324" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#a8b9d2" >From connected systems to clearer release decisions.</text><g transform="translate(71 338) scale(1.1)">
<circle cx="280" cy="270" r="285" fill="url(#halo)"/><rect width="560" height="540" fill="url(#grid)"/>
<g fill="none" stroke="#314d70"><path d="M280 56L514 191V349L280 484L46 349V191Z"/><path d="M280 103L474 216V326L280 438L86 326V216Z" stroke-dasharray="3 10"/><ellipse cx="280" cy="270" rx="264" ry="104" transform="rotate(-30 280 270)" opacity=".45"/><ellipse cx="280" cy="270" rx="264" ry="104" transform="rotate(30 280 270)" opacity=".45"/></g>
<g fill="none" stroke-width="2"><path d="M125 144V216L225 270M435 144V216L335 270M125 396V324L225 270M435 396V324L335 270" stroke="#395976"/><path d="M125 144V216L225 270M335 270L435 216V144" stroke="#70f5e0" class="flow"/><path d="M125 396V324L225 270M335 270L435 324V396" stroke="#b39aff" class="flow-reverse"/></g>
<g class="sweep"><path d="M152 270h256" stroke="#70f5e0" stroke-opacity=".35"/><path d="M200 264h160v12H200Z" fill="#70f5e0" opacity=".025"/></g>
<path d="M280 203L338 237V304L280 338L222 304V237Z" fill="url(#pane)" stroke="url(#accent)" stroke-width="2"/><path d="M280 187L353 229V312L280 354L207 312V229Z" fill="none" stroke="#70f5e0" stroke-opacity=".28" class="beacon"/>
<text x="280" y="261" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#70f5e0" text-anchor="middle" letter-spacing="2">TEST</text><text x="280" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#f1f6ff" text-anchor="middle" letter-spacing="1">EVIDENCE</text>
